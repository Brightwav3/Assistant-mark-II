name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Proves the pinned combination of cores builds and composes together.
jobs:
  # The harness-independent gate. Claude Code has a Stop hook and Codex has no
  # equivalent, so neither can be the layer that holds this. Runs first and is
  # cheap: no submodule build, no ffmpeg, no install.
  documentation-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify documentation structure
        run: npm test

  integration:
    # Gated on the cheap check, not merely listed after it — jobs run in parallel
    # unless something says otherwise. A structure failure now costs seconds
    # instead of a full Windows build with an ffmpeg install and every submodule.
    needs: documentation-structure
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ffmpeg
        run: |
          winget install --id Gyan.FFmpeg --exact --source winget --accept-source-agreements --accept-package-agreements
          ffmpeg -version
      - name: Verify every core
        shell: bash
        run: |
          set -e
          for dir in activation-core core-runtime device-network intelligence-core memory-core aec-system state-core tool-system host-tools "speech-system/realtime core"; do
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm run verify)
            echo "::endgroup::"
          done
      - name: Verify composed runtime
        working-directory: assistant-runtime
        run: npm install --package-lock=false --no-audit --no-fund && npm run verify

  # Portability signal only. It verifies platform-neutral child cores off Windows;
  # it proves nothing about microphone, speaker, or local speech behaviour there.
  # The composed runtime remains covered by the Windows integration job because
  # its relative speech packages include native capture dependencies.
  portability-typecheck:
    needs: documentation-structure
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Typecheck the platform-neutral cores
        run: |
          set -e
          for dir in intelligence-core memory-core aec-system state-core tool-system device-network; do
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm run typecheck)
            echo "::endgroup::"
          done
