name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Proves the pinned combination of cores builds and composes together.
jobs:
  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: |
          winget install --id Gyan.FFmpeg --exact --source winget --accept-source-agreements --accept-package-agreements
          ffmpeg -version
      - name: Verify every core
        shell: bash
        run: |
          set -e
          for dir in activation-core core-runtime device-network intelligence-core memory-core state-core tool-system host-tools "speech-system/realtime core" "speech-system/scribe core" "speech-system/voice core"; do
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm run verify)
            echo "::endgroup::"
          done
      - name: Verify composed runtime
        working-directory: assistant-runtime
        run: npm install --no-audit --no-fund && npm run verify
